name: Sync To Gitee
on:
  push:
    branches: [ main, master ]
  delete:
    branches: [ main, master ]
jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # hub-mirror-action 的 src_token 只用于 API，HTTPS clone 不会带 token
      - name: 配置 GitHub HTTPS 认证
        run: git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"
      - name: 同步到Gitee
        uses: Yikun/hub-mirror-action@master
        with:
          src: github/HR-zju
          dst: gitee/csc105
          dst_key: ${{ secrets.GITEE_PRIVATE_KEY }}
          dst_token: ${{ secrets.GITEE_TOKEN }}
          src_token: ${{ secrets.GITHUB_TOKEN }}
          src_account_type: org
          dst_account_type: user
          static_list: Urban-Nav-SR
          mappings: Urban-Nav-SR=>urbannav
          debug: true
