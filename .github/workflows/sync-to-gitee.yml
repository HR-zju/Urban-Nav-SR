name: Sync To Gitee
on:
  push:
    branches: [ main, master ]
  delete:
    branches: [ main, master ]
jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 同步到 Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          git remote add gitee "https://oauth2:${GITEE_TOKEN}@gitee.com/csc105/urbannav.git" \
            || git remote set-url gitee "https://oauth2:${GITEE_TOKEN}@gitee.com/csc105/urbannav.git"
          git push gitee --all
          git push gitee --tags
