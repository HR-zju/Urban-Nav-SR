# foundation_nav local runtime
# Target: local x86_64 Linux workstation, Python 3.10, CUDA 11.8 PyTorch wheels.
#
# Create:
#   mamba env create -f Policy_part/environment.yml
#
# PyTorch is installed from the official CUDA 11.8 wheel index. Keep this file
# separate from environment.orin26-aarch64.yml: Jetson/Orin needs aarch64
# JetPack-specific wheels and must not use these x86_64 CUDA wheels.
#
# Required system/ROS packages, not reproducible inside this mamba env:
#   ros-humble-desktop-full ros-humble-cv-bridge ros-humble-image-transport
#   ros-humble-rosbag2 ros-humble-rosbag2-storage-mcap
#   ros-humble-realsense2-camera ros-humble-rviz2
#   python3-colcon-common-extensions python3-rosdep python3-vcstool
#   build-essential cmake git curl wget tmux htop tree
#
# When running ROS nodes, source ROS before activating/running this env if your
# shell does not already do so:
#   source /opt/ros/humble/setup.zsh
#   mamba activate foundation_nav
name: foundation_nav
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - numpy=1.26.4
  - scipy=1.15.3
  - matplotlib=3.10.8
  - pillow=9.4.0
  - pyyaml
  - tqdm
  - six
  - packaging
  - protobuf
  - sympy
  - pyserial
  - requests
  - typing_extensions
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu118
      - torch==2.6.0+cu118
      - torchvision==0.21.0+cu118
      - torchaudio==2.6.0+cu118
      - onnxruntime-gpu==1.20.1
      - pytorch-lightning==2.6.1
      - opencv-python==4.13.0.92
      - coloredlogs==15.0.1
      - flatbuffers==25.12.19
      - cyclonedds==0.10.2
      - empy==4.2.1
      - lark-parser==0.12.0
      - rich==14.3.3
      - rich-click==1.9.7
      - unitree-sdk2py==1.0.1
