gnss_spp_node:
  ros__parameters:
    enable_kml_export: true
    kml_directory: /home/symc/data/kml
    kml_raw_directory: /home/symc/data/kml_raw

    dynamic_aligner.window_size: 100
    dynamic_aligner.min_dist: 1.0
    dynamic_aligner.ransac_iters: 100
    dynamic_aligner.inlier_thresh: 2.0
    dynamic_aligner.filter_gain: 0.05
    dynamic_aligner.anchor_window_size: 100
    dynamic_aligner.anchor_min_dist: 10.0

    gnss.initial_calibration_enu: [-3.0, -4.5, 0.0]  # [m] (East, North, Up)