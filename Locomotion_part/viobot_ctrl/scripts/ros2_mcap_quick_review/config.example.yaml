paths:
  data_root: /mnt/nas/rosbags
  work_dir: ./work

scan:
  include_standalone_mcap: true
  include_standalone_db3: false

# Pure Python MCAP reader. No ROS installation is required.
# Custom message types are decoded from ros2msg schemas embedded in the MCAP.
reader: {}
topics:
  camera:
    names:
      - /camera/front/image_raw
      - /camera/front/image/compressed
      - /camera/front/image_compressed
    supported_types:
      - sensor_msgs/msg/Image
      - sensor_msgs/msg/CompressedImage
    name_hints: [front, camera, image]

  gps:
    names:
      - /localization/fused_gps
      - /gps/fused
      - /gps/fix
    supported_types:
      - sensor_msgs/msg/NavSatFix
      - nav_msgs/msg/Odometry
      - geometry_msgs/msg/PoseStamped
    name_hints: [gps, gnss, fused]
    coordinate_mode: auto
    fields:
      latitude: ""
      longitude: ""
      x: ""
      y: ""
      z: ""

  vio:
    names:
      - /vio/odometry
      - /odom
      - /localization/odometry
    supported_types:
      - nav_msgs/msg/Odometry
      - geometry_msgs/msg/PoseStamped
    name_hints: [vio, odom, odometry]
    # Standard ROS base_link uses +X forward (0). Use 90 for Stereo3, whose
    # vehicle-forward direction is body +Y.
    heading_yaw_offset_deg: 0.0
    fields:
      x: ""
      y: ""
      z: ""
      qx: ""
      qy: ""
      qz: ""
      qw: ""

timestamps:
  source: auto
  minimum_header_valid_ratio: 0.80
  minimum_header_overlap_ratio: 0.50

preprocess:
  output_width: 1280
  output_height: 720
  output_fps: 10
  playback_speed: 2.0
  max_source_camera_fps: 15
  max_gps_fps: 10
  max_vio_fps: 20
  jpeg_quality: 85
  max_review_duration_sec: 180
  camera_max_gap_sec: 0.25
  gps_max_gap_sec: 1.00
  vio_max_gap_sec: 0.20
  ffmpeg_crf: 23
  ffmpeg_preset: veryfast

# Optional VIO ground-truth overlay on the camera panel. The yaw correction is
# shared with topics.vio.heading_yaw_offset_deg.
gt_overlay:
  enabled: false
  horizons_sec: [4.0, 3.0, 2.0, 1.0]
  trajectory_sample_fps: 20
  camera_time_offset_ms: 0.0
  intrinsics: [749.2058, 749.2058, 1003.1, 526.5258]
  distortion: [1.5847e-5, -1.3585e-7, 4.7386e-11]
  camera_height: 0.68
  camera_x_offset: -0.1
  pitch_deg: 8.0
  odom_lateral_convention: left_positive
  path_half_width: 0.22

review:
  bad_reasons:
    - 图像异常
    - GPS异常
    - VIO异常
    - 时间不同步
    - 数据缺失
    - 场景无效
    - 文件损坏
    - 其他

# Optional first-pass decisions overlay. Matching uses the record ID immediately
# after the final "rec_" in each file name. It does not limit preprocessing.
initial_decisions:
  enabled: false
  csv_path: /path/to/decisions.csv
