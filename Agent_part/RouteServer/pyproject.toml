[project]
name = "osm-mcp-server"
version = "0.1.1"
description = "An OpenStreetMap MCP server"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
 "aiohttp>=3.11.13",
 "mcp[cli]>=1.3.0",
 "openai>=1.0.0",
]
[project.optional-dependencies]
macos = [
 "pyobjc-core>=10.0; sys_platform == 'darwin'",
 "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
 "pyobjc-framework-CoreLocation>=10.0; sys_platform == 'darwin'",
]
[[project.authors]]
name = "Jagan Shanmugam"
email = "jaganshanmugam@outlook.com"

[build-system]
requires = [ "hatchling",]
build-backend = "hatchling.build"

[project.scripts]
osm-mcp-server = "mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server"]
